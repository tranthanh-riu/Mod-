plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            arg '-mixin.config=eldenring_core.mixins.json'
            jvmArgs '-Xmx4G'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            arg '-mixin.config=eldenring_core.mixins.json'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'libs_dev'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
            includeGroup('com.eliotlash.mclib')
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // GeckoLib 4 for Boss models & animations
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")

    // Epic Fight (required): Souls-like stamina, roll, guard and animations
    implementation fg.deobf("maven.modrinth:epic-fight:${epicfight_version}")

    // Local dev runtime mods (automatically deobfuscated by ForgeGradle for runClient)
    runtimeOnly fg.deobf("local:xaerominimap-forge-1.20.1-26.6.0:1.0")
    runtimeOnly fg.deobf("local:xaeroworldmap-forge-1.20.1-1.47.0:1.0")
    runtimeOnly fg.deobf("local:worldedit-mod-7.2.15:1.0")
    runtimeOnly fg.deobf("local:lithostitched-forge-1.20.1-1.4.12:1.0")
    runtimeOnly fg.deobf("local:tectonic-3.0.17-forge-1.20.1:1.0")
    runtimeOnly fg.deobf("local:DungeonsArise-1.20.x-2.1.58-release:1.0")
    runtimeOnly fg.deobf("local:Structory_1.20.x_v1.3.5:1.0")
    runtimeOnly fg.deobf("local:Structory_Towers_1.20.x_v1.0.7:1.0")
    runtimeOnly fg.deobf("local:explorify-1.6.6:1.0")
    runtimeOnly fg.deobf("local:YungsApi-1.20-Forge-4.0.6:1.0")
    runtimeOnly fg.deobf("local:YungsBetterDungeons-1.20-Forge-4.0.4:1.0")
    runtimeOnly fg.deobf("local:YungsBetterStrongholds-1.20-Forge-4.0.3:1.0")
    runtimeOnly fg.deobf("local:YungsBetterMineshafts-1.20-Forge-4.0.4:1.0")

    // DawnCraft-style Field Bosses & Mega Boss Dungeons (free Modrinth 1.20.1 Forge)
    runtimeOnly fg.deobf("local:curios-forge-1.20.1:1.0")
    runtimeOnly fg.deobf("local:lionfishapi-1.20.1:1.0")
    runtimeOnly fg.deobf("local:L_Enders_Cataclysm-1.20.1:1.0")
    runtimeOnly fg.deobf("local:mowziesmobs-1.20.1:1.0")
    runtimeOnly fg.deobf("local:CerbonsAPI-Forge-1.20.1:1.0")
    runtimeOnly fg.deobf("local:cloth-config-forge-1.20.1:1.0")
    runtimeOnly fg.deobf("local:BOMD-Forge-1.20.1-1.1.2:1.0")
    runtimeOnly fg.deobf("local:villagerstradingplus-1.20.1:1.0")
    runtimeOnly fg.deobf("local:graveyard-forge-4.0.1:1.0")
    runtimeOnly fg.deobf("local:born_in_chaos-1.20.1:1.0")

    // Mixin annotation processor
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
