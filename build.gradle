plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            arg '-mixin.config=eldenring_core.mixins.json'
            jvmArgs '-Xmx4G'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            arg '-mixin.config=eldenring_core.mixins.json'
            jvmArgs '-Xmx4G'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
            includeGroup('com.eliotlash.mclib')
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // GeckoLib 4 for Boss models & animations
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")

    // playerAnimator (MIT): full-body player weapon combo, Unsheathe & Dodge Roll animations (no Epic Fight!)
    implementation fg.deobf("maven.modrinth:playeranimator:${playeranimator_version}")

    // Modpack mods (Terralith, structure and boss mods, Open Loader...) for runClient/runServer.
    // Pinned in modpack/mods.json, fetched from Modrinth maven. Off by default so a plain
    // build stays fast; turn on with: .\gradlew.bat runClient -Pmodpack
    if (project.hasProperty('modpack')) {
        def isServerOnlyRun = gradle.startParameter.taskNames.any { it.contains('Server') } &&
                              !gradle.startParameter.taskNames.any { it.contains('Client') }
        def modpackSpec = new groovy.json.JsonSlurper().parse(file('modpack/mods.json'))
        modpackSpec.mods.findAll { m ->
            !(m.slug in ['playeranimator', 'geckolib']) && !(isServerOnlyRun && m.server == 'unsupported')
        }.each { m ->
            runtimeOnly fg.deobf("maven.modrinth:${m.project_id}:${m.version_id}")
        }
    }

    // Mixin annotation processor
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// With -Pmodpack, copy the modpack's overrides (Open Loader worldgen datapack, configs) into run/
// so runClient/runServer play exactly like the published modpack.
if (project.hasProperty('modpack')) {
    def syncModpackOverrides = tasks.register('syncModpackOverrides', Copy) {
        from 'modpack/overrides'
        into 'run'
    }
    tasks.matching { it.name.startsWith('prepareRun') }.configureEach { dependsOn syncModpackOverrides }
}
