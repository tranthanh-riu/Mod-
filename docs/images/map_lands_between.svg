<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e1a14"/>
      <stop offset="100%" stop-color="#0d0b08"/>
    </radialGradient>
    <radialGradient id="erdtreeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd86b" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#d49b2a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d49b2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c158"/>
      <stop offset="100%" stop-color="#8a6721"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect x="16" y="16" width="928" height="508" fill="none" stroke="url(#goldBorder)" stroke-width="2" rx="8"/>

  <!-- Title -->
  <text x="480" y="54" text-anchor="middle" fill="#e8c86a" font-family="Georgia, serif" font-size="24" font-weight="bold" letter-spacing="3">THE LANDS BETWEEN — WORLD &amp; WAVE MAP</text>
  <line x1="220" y1="68" x2="740" y2="68" stroke="#8a6721" stroke-width="1"/>

  <!-- Erdtree Glow -->
  <circle cx="480" cy="215" r="95" fill="url(#erdtreeGlow)"/>
  <circle cx="480" cy="215" r="24" fill="#ffe184" stroke="#fff3c4" stroke-width="2"/>
  <text x="480" y="220" text-anchor="middle" fill="#2b1e05" font-family="Georgia, serif" font-size="11" font-weight="bold">ERDTREE</text>

  <!-- Progression Arrows -->
  <g stroke="#c89d3c" stroke-width="2.5" stroke-dasharray="6,4" fill="none">
    <path d="M 190 420 Q 250 350 280 285"/>
    <path d="M 335 260 Q 480 300 660 350"/>
    <path d="M 320 220 Q 390 190 440 205"/>
    <path d="M 525 195 Q 620 155 715 150"/>
  </g>

  <!-- Wave 1: Limgrave & Stormveil -->
  <g transform="translate(70, 380)">
    <rect width="235" height="105" rx="8" fill="#1b2418" stroke="#c89d3c" stroke-width="2"/>
    <text x="16" y="26" fill="#ffd86b" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">WAVE 1 — LIMGRAVE &amp; STORMVEIL</text>
    <text x="16" y="48" fill="#d7d2c5" font-family="Segoe UI, sans-serif" font-size="12">• Tree Sentinel (Open Field)</text>
    <text x="16" y="68" fill="#d7d2c5" font-family="Segoe UI, sans-serif" font-size="12">• Margit, the Fell Omen (Bridge)</text>
    <text x="16" y="88" fill="#d7d2c5" font-family="Segoe UI, sans-serif" font-size="12">• Godrick the Grafted (Castle)</text>
  </g>

  <!-- Wave 2: Liurnia & Caelid -->
  <g transform="translate(150, 170)">
    <rect width="215" height="90" rx="8" fill="#141e2b" stroke="#6aa6d8" stroke-width="2"/>
    <text x="14" y="25" fill="#89c8ff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">WAVE 2 — LIURNIA</text>
    <text x="14" y="48" fill="#d7d2c5" font-family="Segoe UI, sans-serif" font-size="12">• Raya Lucaria Academy</text>
    <text x="14" y="68" fill="#d7d2c5" font-family="Segoe UI, sans-serif" font-size="12">• Rennala, Queen of Full Moon</text>
  </g>

  <g transform="translate(650, 330)">
    <rect width="245" height="95" rx="8" fill="#2b1414" stroke="#d85a4a" stroke-width="2"/>
    <text x="14" y="25" fill="#ff8474" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">WAVE 2 — CAELID (SCARLET ROT)</text>
    <text x="14" y="48" fill="#d7d2c5" font-family="Segoe UI, sans-serif" font-size="12">• Redmane Castle Arena</text>
    <text x="14" y="68" fill="#d7d2c5" font-family="Segoe UI, sans-serif" font-size="12">• Starscourge Radahn</text>
  </g>

  <!-- Wave 3: Leyndell & Mohgwyn -->
  <g transform="translate(365, 295)">
    <rect width="230" height="95" rx="8" fill="#282112" stroke="#e5c158" stroke-width="2"/>
    <text x="14" y="25" fill="#ffd86b" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">WAVE 3 — LEYNDELL &amp; ALTUS</text>
    <text x="14" y="48" fill="#d7d2c5" font-family="Segoe UI, sans-serif" font-size="12">• Morgott, the Omen King</text>
    <text x="14" y="68" fill="#d7d2c5" font-family="Segoe UI, sans-serif" font-size="12">• Rykard &amp; Mohg, Lord of Blood</text>
  </g>

  <!-- Wave 4: Endgame -->
  <g transform="translate(665, 100)">
    <rect width="235" height="115" rx="8" fill="#241529" stroke="#d48cf5" stroke-width="2"/>
    <text x="14" y="25" fill="#e5b3ff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">WAVE 4 — ENDGAME &amp; HALIGTREE</text>
    <text x="14" y="48" fill="#d7d2c5" font-family="Segoe UI, sans-serif" font-size="12">• Malenia, Blade of Miquella</text>
    <text x="14" y="68" fill="#d7d2c5" font-family="Segoe UI, sans-serif" font-size="12">• Maliketh, the Black Blade</text>
    <text x="14" y="88" fill="#d7d2c5" font-family="Segoe UI, sans-serif" font-size="12">• Godfrey &amp; Radagon / Elden Beast</text>
  </g>

  <!-- Legend -->
  <text x="480" y="508" text-anchor="middle" fill="#a8997a" font-family="Segoe UI, sans-serif" font-size="12">Site of Grace checkpoints • Golden Fog Gates at Boss Arenas • Custom Biomes &amp; Legacy Dungeons</text>
</svg>
